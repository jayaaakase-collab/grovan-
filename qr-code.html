<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GROVANÉ QR Code</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }
        img {
            width: 300px;
            height: 300px;
            display: block;
            margin: 0 auto 20px;
            border-radius: 10px;
        }
        h1 {
            margin: 0;
            color: #2d2d2d;
            font-size: 30px;
        }
        p {
            margin: 8px 0 0;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://jayaaakase-collab.github.io/grovan-" alt="GROVANÉ QR Code" />
        <h1>GROVANÉ</h1>
        <p>Scan to open the visiting card website</p>
    </div>
</body>
</html>
