<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROVANÉ - Visiting Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            border: 3px solid white;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .content {
            padding: 40px 30px;
        }

        .info-section {
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 15px;
            color: #333;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .info-text {
            flex: 1;
        }

        .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-top: 2px;
            word-break: break-all;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }

        .qr-section {
            text-align: center;
        }

        .qr-title {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        #qrcode {
            display: inline-block;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        #qrcode img {
            border-radius: 8px;
        }

        .footer {
            background: #f9f9f9;
            padding: 20px 30px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }

            .brand-name {
                font-size: 28px;
            }

            .content {
                padding: 30px 20px;
            }

            .logo {
                width: 70px;
                height: 70px;
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Header Section -->
            <div class="header">
                <div class="logo">GV</div>
                <div class="brand-name">GROVANÉ</div>
                <div class="tagline">Premium Brand</div>
            </div>

            <!-- Content Section -->
            <div class="content">
                <!-- Contact Information -->
                <div class="info-section">
                    <!-- Email -->
                    <div class="info-item">
                        <div class="info-icon">✉️</div>
                        <div class="info-text">
                            <div class="label">Email</div>
                            <div class="value">grované@gqmil.com</div>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="info-item">
                        <div class="info-icon">📱</div>
                        <div class="info-text">
                            <div class="label">Contact</div>
                            <div class="value">+91 93458 47899</div>
                        </div>
                    </div>

                    <!-- Location -->
                    <div class="info-item">
                        <div class="info-icon">📍</div>
                        <div class="info-text">
                            <div class="label">Location</div>
                            <div class="value">Pondicherry, India</div>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- QR Code Section -->
                <div class="qr-section">
                    <div class="qr-title">Scan to Connect</div>
                    <div id="qrcode"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                © 2026 GROVANÉ | Premium Brand Experience
            </div>
        </div>
    </div>

    <script>
        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: "https://jayaaakase-collab.github.io/grovan-/",
            width: 200,
            height: 200,
            colorDark: "#667eea",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
